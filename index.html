<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoi On Brand 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b3250;--deep:#041a2e;--teal:#00a5b8;--pink:#00808f;--paper:#eef3f7;--card:#fff;--ink:#0b3250;--muted:#53687a;--line:#d6e0e8;--soft:#e0f4f7;
--f:"Montserrat","Segoe UI",system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#061624;--card:#0d2740;--ink:#eaf3f8;--muted:#9db3c3;--line:#1d3a55;--soft:#10394b;--pink:#35c6d6;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--f)}
.w{max-width:1160px;margin:0 auto;padding:0 22px}
.hero{background:radial-gradient(120% 120% at 100% 0,#041a2e 0,#0a2d49 60%,#0b3a5c 100%);color:#fff;padding:36px 0 120px}
.hero .top{display:flex;justify-content:space-between;align-items:center}
.hero .top img{height:44px}
.hero .top small{color:var(--teal);letter-spacing:.2em;font-size:12px}
h1{font:800 clamp(36px,11vw,112px)/.95 var(--f);margin:70px 0 22px;letter-spacing:-.02em}
h1 span{color:var(--teal);display:block}
.hero p{max-width:50ch;font-size:19px;margin:0;color:#d6e6f0}
.hero .rule{width:70px;height:3px;background:var(--teal);margin:0 0 22px}
.stats{margin-top:-70px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.stat{background:var(--card);border-radius:8px;padding:22px 24px;box-shadow:0 10px 30px rgba(4,26,46,.18)}
.stat b{display:block;font:800 clamp(38px,7vw,64px)/1 var(--f);color:var(--teal)}
.stat:nth-child(2) b{color:var(--pink)}.stat:nth-child(3) b{color:var(--ink)}
.stat span{color:var(--muted);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 0;margin-top:34px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--navy);background:transparent;color:var(--ink);border-radius:99px;padding:9px 16px;font:700 14px var(--f);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:22px;padding:28px 0;align-items:start}
.card{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.card.open{grid-column:1/-1;border-color:var(--teal)}
button.top2{all:unset;display:block;cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.img{height:190px;overflow:hidden;background:var(--navy)}
.img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:not(.open) .top2:hover img{transform:scale(1.04)}
.card.open .img{height:min(420px,60vw)}
.in{padding:18px 22px 22px}
.tag{display:inline-block;background:var(--soft);color:var(--teal);font:700 12px var(--f);padding:2px 11px;border-radius:99px}
h3{font:800 24px/1.15 var(--f);margin:10px 0 6px}
.in p{margin:0;color:var(--muted)}
.more{display:none;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.card.open .more{display:block}
.more ul{margin:8px 0 16px;padding-left:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.like{border:1.5px solid var(--pink);background:transparent;color:var(--pink);border-radius:99px;padding:6px 16px;font:700 14px var(--f);cursor:pointer}
.like[aria-pressed="true"]{background:var(--pink);color:var(--card)}
.hint{font-size:13px;color:var(--muted)}
.next{margin:20px 0 0;border-radius:8px;padding:40px;background:linear-gradient(120deg,var(--deep),var(--navy));color:#fff}
.next h2{font:800 clamp(28px,5vw,44px)/1.05 var(--f);margin:0 0 10px}
.next h2 em{font-style:normal;color:var(--teal)}
.next p{margin:0 0 22px;color:#d6e6f0;max-width:52ch}
.vote{display:flex;gap:12px;flex-wrap:wrap}
.vote button{border:2px solid var(--teal);background:transparent;color:#fff;border-radius:14px;padding:12px 20px;font:700 16px var(--f);cursor:pointer}
.vote button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#0b3250}
.vote span{border:2px solid var(--teal);border-radius:14px;padding:10px 20px;font-weight:700}
footer{padding:44px 0 56px;color:var(--muted);display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer img{height:40px}
footer a{color:var(--teal);font-weight:700}
.logo-d{display:block}.logo-l{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-d{display:none}:root:not([data-theme="light"]) .logo-l{display:block}}
@media (min-width:900px){
.card.open{display:grid;grid-template-columns:1.3fr 1fr}
.card.open .top2{grid-column:1}
.card.open .more{grid-column:2;margin:0!important;padding:32px 30px!important;border-top:0;border-left:1px solid var(--line);align-self:stretch}
.card.open .img{height:380px}
.card.open h3{font-size:28px}
}
@media (max-width:620px){
.stats{grid-template-columns:1fr}.stat{padding:16px 20px}
.next{padding:26px}
.hero{padding:24px 0 100px}.hero .top img{height:36px}.hero h1{margin:44px 0 18px}.hero p{font-size:17px}
.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap}.cnt{display:none}
.grid{gap:16px;padding:20px 0}
.card.open .img{height:56vw}
footer{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.img img{transition:none}}
</style></head><body>

var cats=["All"],cur="All",likes={};P.forEach(function(p){if(cats.indexOf(p.c)<0)cats.push(p.c)});

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function rg(){var L=P.filter(function(p){return cur==="All"||p.c===cur});cnt.textContent=L.length+" of "+P.length+" projects";grid.innerHTML="";

var l=e.querySelector(".like");l.onclick=function(){likes[k]=!likes[k];l.setAttribute("aria-pressed",!!likes[k]);l.textContent=likes[k]?"Liked":"Like this"};grid.appendChild(e)})}
